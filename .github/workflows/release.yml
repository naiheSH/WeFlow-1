name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: mac, arch: x64, runner: macos-15-intel}
          - {platform: mac, arch: arm64, runner: macos-15}
          - {platform: win, arch: x64, runner: windows-2025}
          - {platform: win, arch: arm64, runner: windows-11-arm}
          - {platform: linux, arch: x64, runner: ubuntu-24.04}
          - {platform: linux, arch: arm64, runner: ubuntu-24.04-arm}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm
      - name: Install dependencies
        if: matrix.platform != 'win' || matrix.arch != 'arm64'
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Install Windows ARM64 dependencies
        if: matrix.platform == 'win' && matrix.arch == 'arm64'
        run: |
          npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          npm rebuild electron esbuild sharp koffi @hicccc77/electron-liquid-glass
          # ffmpeg-static has no Windows ARM64 binary. Its standalone x64 EXE
          # runs through Windows 11 emulation; Node/Electron remain ARM64.
          npm_config_arch=x64 node node_modules/ffmpeg-static/install.js
      - name: Set tag version and fork update repository
        env:
          BUILD_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (process.env.BUILD_TAG) p.version = process.env.BUILD_TAG.slice(1);
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          p.build.publish = { provider: 'github', owner, repo };
          p.build.artifactName = '${productName}-${version}-${os}-${arch}.${ext}';
          p.build.mac.target = ['dmg'];
          p.build.linux.target = ['AppImage'];
          // Bundled VC runtime DLLs are x64-only; ARM64 uses its system runtime.
          if (process.platform === 'win32' && process.arch === 'arm64') p.build.win.extraFiles = [];
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
      - name: Test WCDB compatibility
        run: npm run test:wcdb
      - name: Type check
        run: npm run typecheck
      - name: Build application
        run: node scripts/clean-dist-electron.cjs && npx vite build
      - name: Package installers
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: npx electron-builder --"$PLATFORM" --"$ARCH" --publish never
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: WeFlow-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage

  release:
    name: Publish direct installer downloads
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: WeFlow-*
          path: installers
      - name: Publish installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$BUILD_TAG" ]; then
            TAG="$BUILD_TAG"
            RELEASE_FLAGS=()
          else
            TAG="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            RELEASE_FLAGS=(--prerelease --latest=false)
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" "${RELEASE_FLAGS[@]}" --notes 'Download the installer for your platform and architecture directly from Assets: macOS .dmg, Windows .exe, Linux .AppImage. Unsigned builds; database and media plugins must be configured separately. See docs/third-party-components.md.'
          fi
          find installers -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' \) -print0 |
            xargs -0 gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber
          echo "### Direct installer downloads" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
